name: Update JSON Manifest

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.json'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate index.json
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BASE_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}"

          # Start building JSON
          echo '{"files": [' > index.json
          
          first=true
          # Find all JSON files except index.json itself
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            if [ "$filename" != "index.json" ]; then
              # Remove leading ./
              clean_path="${file#./}"
              if [ "$first" = true ]; then
                first=false
              else
                echo ',' >> index.json
              fi
              # Escape any special characters in filename and url
              escaped_filename=$(printf '%s' "$clean_path" | sed 's/"/\\"/g')
              escaped_url=$(printf '%s' "${BASE_URL}/${clean_path}" | sed 's/"/\\"/g')
              echo '  {"filename": "'"$escaped_filename"'", "url": "'"$escaped_url"'"}' >> index.json
            fi
          done < <(find . -name "*.json" -type f ! -path "./.git/*" ! -name "index.json" -print0 | sort -z)

          # Close the files array and add updated_at
          echo '],' >> index.json
          echo '  "updated_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"' >> index.json
          echo '}' >> index.json

          # Show what we generated
          echo "Generated JSON before pretty-print:"
          cat index.json

          # Validate and pretty print
          python3 -m json.tool index.json > index.tmp.json && mv index.tmp.json index.json
          
          echo "Final index.json:"
          cat index.json

      - name: Commit and push if changed
        run: |
          if [ ! -f "index.json" ]; then
            echo "index.json not found"
            exit 1
          elif ! git diff --quiet HEAD -- index.json 2>/dev/null; then
            echo "index.json has changes, committing"
            git add index.json
            git commit -m "chore: update index.json manifest"
            git push
          else
            echo "No changes to index.json"
          fi