name: Update JSON Manifest

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.json'
  workflow_dispatch:

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate index.json
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          BASE_URL="https://raw.githubusercontent.com/${REPO}/${BRANCH}"

          # Start building JSON
          echo '{"files": [' > index.json
          
          first=true
          # Find all JSON files except index.json itself
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            if [ "$filename" != "index.json" ]; then
              # Remove leading ./
              clean_path="${file#./}"
              if [ "$first" = true ]; then
                first=false
              else
                echo ',' >> index.json
              fi
              # Escape any special characters in filename and url
              escaped_filename=$(printf '%s' "$clean_path" | sed 's/"/\\"/g')
              escaped_url=$(printf '%s' "${BASE_URL}/${clean_path}" | sed 's/"/\\"/g')
              echo '  {"filename": "'"$escaped_filename"'", "url": "'"$escaped_url"'"}' >> index.json
            fi
          done < <(find . -name "*.json" -type f ! -path "./.git/*" ! -name "index.json" -print0 | sort -z)

          # Close the files array and add updated_at
          echo '],' >> index.json
          echo '  "updated_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"' >> index.json
          echo '}' >> index.json

          # Validate and pretty print
          python3 -m json.tool index.json > index.tmp.json && mv index.tmp.json index.json
          
          echo "Generated index.json:"
          cat index.json

      - name: Commit and push if changed
        run: |
          # Check if index.json exists
          if [ ! -f "index.json" ]; then
            echo "ERROR: index.json was not generated"
            exit 1
          fi

          # Check if there are changes to commit
          if git status --porcelain | grep -q "index.json"; then
            echo "Changes detected in index.json"
            
            # Add the file
            git add index.json
            
            # Check if we're on main or master branch
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            echo "Current branch: $CURRENT_BRANCH"
            
            # Commit changes
            git commit -m "chore: update index.json manifest [skip ci]"
            
            # Push with force-with-lease to avoid conflicts
            git push --force-with-lease origin $CURRENT_BRANCH
            
            echo "Successfully committed and pushed index.json"
          else
            echo "No changes to index.json"
          fi

      - name: Verify push
        run: |
          # Verify the file exists in the repo after push
          echo "Current directory contents after push:"
          ls -la
          echo "Checking if index.json exists:"
          if [ -f "index.json" ]; then
            echo "✅ index.json exists locally"
            echo "Contents:"
            cat index.json
          else
            echo "❌ index.json not found locally"
          fi
          
          # Check git status
          echo "Git status:"
          git status
          
          # Check git log
          echo "Last commit:"
          git log -1 --oneline